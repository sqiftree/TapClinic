<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TapClinic — Peta Tubuh Interaktif Pra-Konsultasi</title>
  <meta name="description" content="TapClinic: Antarmuka Peta Tubuh Interaktif Bebas Papan Ketik untuk Anamnesis Pra-Konsultasi di Klinik Kampus (Proyek Riset IMK UNS)." />
  <link rel="icon" type="image/svg+xml" href="assets/tapclinic-logo.svg" />
  <link rel="stylesheet" href="css/styles.css?v=6" />
</head>
<body class="visual-first">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-home" class="brand-btn" type="button" aria-label="Kembali ke beranda TapClinic">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none">
              <defs>
                <linearGradient id="tcGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#066cf4"/>
                  <stop offset="100%" stop-color="#0284c7"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tcGrad)"/>
              <path d="M50.54 22.14 A21 21 0 1 1 41.86 13.46" stroke="#ffffff" stroke-width="2.6" stroke-opacity="0.5" stroke-linecap="round"/>
              <circle cx="46.8" cy="17.2" r="2.7" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
              <rect x="28.5" y="13.5" width="7" height="10.5" rx="3.5" fill="#ffffff"/>
              <rect x="28.5" y="40" width="7" height="10.5" rx="3.5" fill="#ffffff"/>
              <rect x="13.5" y="28.5" width="10.5" height="7" rx="3.5" fill="#ffffff"/>
              <rect x="40" y="28.5" width="10.5" height="7" rx="3.5" fill="#ffffff"/>
              <circle cx="32" cy="32" r="4.2" fill="#ffffff"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>TapClinic</strong>
            <small class="label-text">IMK UNS 2026</small>
          </span>
        </button>
      </div>

      <div class="topbar-actions">
        <button id="btn-toggle-labels" class="icon-pill-btn" type="button" aria-pressed="false" title="Tampilkan / sembunyikan label kata singkat" aria-label="Tampilkan atau sembunyikan label kata singkat">
          <span class="aa-glyph">Aa</span>
          <span class="pill-state-dot" aria-hidden="true"></span>
        </button>

        <button id="btn-open-data" class="icon-pill-btn" type="button" title="Data Eksperimen Tersimpan" aria-label="Buka data eksperimen tersimpan">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path>
            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
          </svg>
          <span id="dataset-count-badge" class="count-badge">0</span>
        </button>
      </div>
    </header>

    <main id="app-main" class="app-main" aria-live="polite"></main>
  </div>

  <!-- Modal / Drawer untuk Dataset Tersimpan -->
  <div id="data-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="data-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="data-modal-title">Dataset Eksperimen HCI</h2>
        <button id="btn-close-data" class="close-icon-btn" type="button" aria-label="Tutup panel data">✕</button>
      </div>
      <div id="data-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script defer src="js/icons.js?v=6"></script>
  <script defer src="js/anatomy-svg.js?v=6"></script>
  <script defer src="js/telemetry.js?v=6"></script>
  <script defer src="js/variant-b.js?v=6"></script>
  <script defer src="js/variant-a.js?v=6"></script>
  <script defer src="js/experiment.js?v=6"></script>
  <script defer src="js/app.js?v=6"></script>
</body>
</html>
